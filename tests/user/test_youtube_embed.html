<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Embed Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #1a1a1a;
      color: #eee;
    }
    h1 { font-size: 1.2em; }
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      margin: 20px 0;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
    }
    .note {
      font-size: 0.9em;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>YouTube Embed Test — Tab Feasibility</h1>
  <div class="video-container">
    <iframe
      src="https://www.youtube.com/embed/UvmWxm3nR6E"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
  <p class="note">Testing if a YouTube iframe embed can work inside a DeepLooking lens tab popup.</p>
</body>
</html>
